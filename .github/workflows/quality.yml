name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      # requirements-data.txt (scanpy) is deliberately NOT installed. The
      # real-data tests are guarded on the Kang cache, which CI does not have,
      # so they skip -- and CI stays a few seconds instead of a few minutes.
      - run: python -m ruff check .
      - run: python -m pytest
      - name: harness self-test (no data needed)
        run: python -m backtest.selftest
      - name: toy pipeline runs end to end
        run: python spine/run_demo.py --quiet
