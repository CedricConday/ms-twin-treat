# Test config lives HERE and only here. pytest reads pytest.ini in preference to
# pyproject.toml, so a [tool.pytest.ini_options] block there would be dead.
[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::FutureWarning:mesa.*
markers =
    slow: needs the Kang cache or downloads an external dataset
